name: Release

# Every push to main rebuilds Visor.app and refreshes the rolling release
# asset, so the in-app "Update Visor" button and the curl installer always
# serve the latest main — hands off.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/make-app.sh"
      - "scripts/AppIcon.icns"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest   # Apple Silicon; matches the arm64 build
    steps:
      - uses: actions/checkout@v5

      - name: Build Visor.app
        run: bash scripts/make-app.sh --build-only   # $CI is set, so it won't install locally

      - name: Package
        run: ditto -c -k --keepParent dist/Visor.app dist/Visor.zip

      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          # Release notes = this version's section of the changelog.
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 { f=1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "See CHANGELOG.md" > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Visor.zip --clobber
            gh release edit "$TAG" --title "Visor $VERSION" --notes-file /tmp/notes.md --latest
          else
            gh release create "$TAG" dist/Visor.zip --title "Visor $VERSION" --notes-file /tmp/notes.md --latest
          fi
