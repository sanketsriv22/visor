name: Release

# Every push to main rebuilds Visor.app and refreshes the rolling release
# asset, so the in-app "Update Visor" button and the curl installer always
# serve the latest main — hands off.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/make-app.sh"
      - "scripts/AppIcon.icns"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest   # Apple Silicon; matches the arm64 build
    steps:
      - uses: actions/checkout@v5

      - name: Build Visor.app
        run: bash scripts/make-app.sh --build-only   # $CI is set, so it won't install locally

      - name: Package
        run: ditto -c -k --keepParent dist/Visor.app dist/Visor.zip

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 \
            || gh release create v0.1.0 --title "Visor (latest main)" --notes "Auto-built from main."
          gh release upload v0.1.0 dist/Visor.zip --clobber
          gh release edit v0.1.0 --notes "Auto-built from main @ ${GITHUB_SHA:0:7}"
